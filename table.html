<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Excellence in Innovation – Interactive Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #0b1220;
      --card-border: #1e293b;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.08);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --chip-bg: rgba(148, 163, 184, 0.16);
      --chip-border: rgba(148, 163, 184, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 1.5rem;
      line-height: 1.5;
      max-width: 1200px;
      margin: 0 auto;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      color: var(--text);
    }

    h1 {
      margin-bottom: 0.25rem;
      font-size: 1.7rem;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin-bottom: 0.75rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .subtitle code {
      background: rgba(15, 23, 42, 0.9);
      padding: 0.05rem 0.3rem;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    /* Trend chips bar */

    .trend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }

    .trend-chip {
      padding: 0.2rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      background: rgba(15, 23, 42, 0.96);
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease,
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .trend-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.9);
    }

    .trend-chip.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
      box-shadow:
        0 0 0 1px rgba(56, 189, 248, 0.5),
        0 16px 35px rgba(8, 47, 73, 0.9);
    }

    #filter-input {
      padding: 0.55rem 0.9rem;
      margin: 0.2rem 0 1.2rem 0;
      max-width: 420px;
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9), 0 12px 30px rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(16px);
    }

    #filter-input::placeholder {
      color: #6b7280;
    }

    #filter-input:focus {
      border-color: var(--accent);
      box-shadow:
        0 0 0 1px rgba(15, 23, 42, 0.9),
        0 0 0 1px rgba(56, 189, 248, 0.6),
        0 18px 40px rgba(15, 23, 42, 0.95);
    }

    table {
      border-collapse: separate;
      border-spacing: 0 0.85rem;
      width: 100%;
    }

    th, td {
      font-size: 0.9rem;
      text-align: left;
      vertical-align: top;
    }

    th {
      padding: 0 0.3rem 0.35rem 0.3rem;
      color: var(--muted);
      font-weight: 500;
      user-select: none;
      cursor: pointer;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }

    th span.header-label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.5rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    th.sorted-asc span.header-label,
    th.sorted-desc span.header-label {
      border-color: var(--accent);
      background: rgba(15, 23, 42, 0.95);
      color: var(--accent);
    }

    th.sorted-asc::after,
    th.sorted-desc::after {
      margin-left: 0.25rem;
      font-size: 0.7rem;
      content: "";
    }

    th.sorted-asc::after {
      content: "▲";
    }

    th.sorted-desc::after {
      content: "▼";
    }

    tbody tr {
      transition:
        transform 0.18s ease,
        box-shadow 0.2s ease,
        background 0.18s ease;
    }

    tbody tr td {
      padding: 0.85rem 1rem;
      background: linear-gradient(120deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.92));
      border-top: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
    }

    tbody tr td:first-child {
      border-left: 1px solid var(--card-border);
      border-radius: 16px 0 0 16px;
      width: 260px;
    }

    tbody tr td:last-child {
      border-right: 1px solid var(--card-border);
      border-radius: 0 16px 16px 0;
    }

    tbody tr:hover td {
      background: radial-gradient(circle at top left, var(--accent-soft), rgba(15, 23, 42, 0.98));
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.95);
    }

    tbody tr:hover {
      transform: translateY(-1px);
    }

    tr.no-data td {
      text-align: center;
      font-style: italic;
      color: var(--muted);
      border-radius: 14px;
      border: 1px dashed rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: none;
    }

    .image-cell {
      width: 260px;
    }

    .image-cell-inner {
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at top, #1e293b, #020617);
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.9);
    }

    .image-cell img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      transition: transform 0.25s ease;
    }

    tbody tr:hover .image-cell img {
      transform: scale(1.02);
    }

    .image-pill {
      position: absolute;
      inset: auto 0 0 0;
      display: flex;
      justify-content: flex-start;
      padding: 0.35rem 0.5rem;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.96), transparent);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .project-title {
      font-weight: 600;
      margin: 0 0 0.2rem 0;
      font-size: 1rem;
      letter-spacing: 0.01em;
    }

    .project-title a {
      text-decoration: none;
      color: var(--text);
    }

    .project-title a:hover {
      color: var(--accent);
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.6);
    }

    .tagline {
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.9rem;
      margin-bottom: 0.45rem;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--muted);
    }

    .meta-badge {
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: rgba(15, 23, 42, 0.9);
    }

    .impact-label,
    .expertise-label {
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .impact-text,
    .expertise-text {
      margin: 0.15rem 0 0.55rem 0;
      font-size: 0.88rem;
      color: #e5e7eb;
    }

    .expertise-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.28rem;
      margin: 0.2rem 0 0.2rem 0;
    }

    .chip {
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: #e5e7eb;
      white-space: nowrap;
    }

    @media (max-width: 800px) {
      body {
        padding: 1rem;
      }

      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead {
        display: none;
      }

      tbody tr {
        margin-bottom: 0.9rem;
      }

      tbody tr td {
        border-radius: 14px;
        border: 1px solid var(--card-border);
        margin-top: -1px;
      }

      tbody tr td:first-child {
        border-radius: 14px 14px 0 0;
      }

      tbody tr td:last-child {
        border-radius: 0 0 14px 14px;
      }

      .image-cell {
        width: 100%;
      }

      .image-cell-inner {
        border-radius: 14px 14px 0 0;
      }
    }
  </style>
</head>
<body>
  <h1>MathWorks Excellence in Innovation – Projects</h1>
  <p class="subtitle">
    Type a trend or click a tag (for example <code>Robotics</code>, <code>5G</code>, <code>Autonomous Vehicles</code>,
    <code>Sustainability</code>, <code>Deep Learning</code>) to filter projects.
    Filtering looks primarily at <strong>Expertise gained</strong>.
  </p>

  <!-- Trend chips go here -->
  <div class="trend-bar" id="trend-bar"></div>

  <input
    id="filter-input"
    type="text"
    placeholder="Filter by expertise/trend (e.g., Robotics, 5G, Sustainability, Deep Learning)…"
  />

  <table id="projects-table">
    <thead>
      <tr>
        <th data-key="title"><span class="header-label">Image</span></th>
        <th data-key="expertise"><span class="header-label">Project · Impact · Expertise</span></th>
      </tr>
    </thead>
    <tbody>
      <!-- rows created by JavaScript -->
    </tbody>
  </table>

  <script>
    // Example subset – extend with all projects.
    const projects = [
      {
        title: "Classify RF Signals Using AI",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/blob/main/projects/Classify%20RF%20Signals%20Using%20AI",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/ai-for-wireless-synthetic-waveform-dataset.jpg",
        tagline: "Use deep learning to classify wireless signals and perform real-world testing with SDR.",
        impact: "Help to mitigate the ever-increasing RF interference problem in the developed world.",
        expertise: "5G, Artificial Intelligence, Deep Learning, Image Processing, Machine Learning, Neural Networks, Software-defined Radio, Wireless Communication"
      },
      {
        title: "Deep Image Prior for Inverse Problems in Imaging",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/blob/main/projects/Deep%20Image%20Prior%20for%20Inverse%20Problems%20in%20Imaging",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/dip.png",
        tagline: "Use the Deep Image Prior to solve inverse problems in imaging.",
        impact: "Provide high-quality solutions to inverse problems in imaging that are ubiquitous in industry.",
        expertise: "Artificial Intelligence, Computer Vision, Deep Learning, Image Processing, Machine Learning, Neural Networks, Optimization, Signal Processing"
      },
      {
        title: "Energy-Optimal Trajectory Planning for Multirotor Drones",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/tree/main/projects/Energy-Optimal%20Trajectory%20Planning%20for%20Multirotor%20Drones",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/UAV_plan.png",
        tagline: "Develop trajectory planning for multirotor drones that minimizes energy consumption.",
        impact: "Increase mission time of multirotor drones.",
        expertise: "Drones, Robotics, Autonomous Vehicles, Electrification, Modeling and Simulation, Optimization, UAV"
      },
      {
        title: "Techno-Economic Assessment of Green Hydrogen Production",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/tree/main/projects/Techno-Economic%20Assessment%20of%20Green%20Hydrogen%20Production",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/clean-energy.jpg",
        tagline: "Perform early-stage economic feasibility of an energy project for green hydrogen.",
        impact: "Connect economic aspects to technical design.",
        expertise: "Sustainability and Renewable Energy, Modeling and Simulation, Electrification"
      },
      {
        title: "Reinforcement Learning Based Fault Tolerant Control of a Quadrotor",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/tree/main/projects/Reinforcement%20Learning%20Based%20Fault%20Tolerant%20Control%20of%20a%20Quadrotor",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/UAM.jpg",
        tagline: "Develop a fault-tolerant controller for a quadcopter using model-based reinforcement learning.",
        impact: "Improve safety of multi-rotor drones.",
        expertise: "Drones, Artificial Intelligence, Robotics, Control, Reinforcement Learning, UAV"
      },
      {
        title: "Digital Twin and Predictive Maintenance of Pneumatic Systems",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/tree/main/projects/Digital%20Twin%20and%20Predictive%20Maintenance%20of%20Pneumatic%20Systems",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/pneumaticSys.jpg",
        tagline: "Predict faults in pneumatic systems using simulation and AI/machine learning.",
        impact: "Improve efficiency and reliability of industrial processes.",
        expertise: "Artificial Intelligence, Industry 4.0, Cyber-Physical Systems, Digital Twins, Embedded AI, Health Monitoring, IoT, Machine Learning, Modeling and Simulation"
      },
      {
        title: "Wind Turbine Predictive Maintenance Using Machine Learning",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/tree/main/projects/Wind%20Turbine%20Predictive%20Maintenance%20Using%20Machine%20Learning",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/turbine.png",
        tagline: "Use machine learning to build predictive maintenance models for wind turbines.",
        impact: "Contribute to providing the world with reliable green energy.",
        expertise: "Industry 4.0, Sustainability and Renewable Energy, Machine Learning, Electrification, Modeling and Simulation, Predictive Maintenance, Wind Turbines"
      },
      {
        title: "Autonomous Navigation for Vehicles in Rough Terrain",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/tree/main/projects/Autonomous%20Navigation%20for%20Vehicles%20in%20Rough%20Terrain",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/rover.jpg",
        tagline: "Design motion planning algorithms for off-road vehicles on rough terrain.",
        impact: "Expand the frontiers of off-road exploration and navigation using mobile robots.",
        expertise: "Autonomous Vehicles, Computer Vision, Robotics, Image Processing, Mobile Robots, SLAM, UGV, Optimization"
      },
      {
        title: "Signal Coverage Maps Using Measurements and Machine Learning",
        url: "https://github.com/mathworks/MathWorks-Excellence-in-Innovation/tree/main/projects/Signal%20Coverage%20Maps%20Using%20Measurements%20and%20Machine%20Learning",
        image: "https://gist.githubusercontent.com/robertogl/e0115dc303472a9cfd52bbbc8edb7665/raw/wireless.jpg",
        tagline: "Generate coverage maps from limited measurements using ML.",
        impact: "Reduce the cost of 5G and IoT network deployment.",
        expertise: "Artificial Intelligence, 5G, Machine Learning, Wireless Communication"
      }
      // 👉 Add the rest of your projects here
    ];

    // Trend terms for the chips
    const trendTerms = [
      "Robotics",
      "Autonomous Vehicles",
      "5G",
      "Drones",
      "Computer Vision",
      "Artificial Intelligence",
      "Sustainability and Renewable Energy",
      "Industry 4.0",
      "Electrification",
      "Big Data",
      "SLAM"
    ];

    const filterInput = document.getElementById('filter-input');
    const table = document.getElementById('projects-table');
    const tbody = table.querySelector('tbody');
    const headers = Array.from(table.querySelectorAll('thead th'));
    const trendBar = document.getElementById('trend-bar');

    let sortState = { key: null, direction: 1 }; // 1 = asc, -1 = desc
    let activeTrend = null;

    // Build trend chips
    trendTerms.forEach(term => {
      const btn = document.createElement('button');
      btn.className = 'trend-chip';
      btn.textContent = term;
      btn.dataset.term = term;
      trendBar.appendChild(btn);
    });

    const trendChips = () => Array.from(document.querySelectorAll('.trend-chip'));

    function setActiveTrend(termOrNull) {
      activeTrend = termOrNull;
      trendChips().forEach(chip => {
        chip.classList.toggle('active', chip.dataset.term === activeTrend);
      });
    }

    function buildChips(expertise) {
      const container = document.createElement('div');
      container.className = 'expertise-chips';

      if (!expertise) return container;

      expertise.split(',').map(t => t.trim()).forEach(tag => {
        if (!tag) return;
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = tag;
        container.appendChild(chip);
      });

      return container;
    }

    function buildRow(project) {
      const tr = document.createElement('tr');

      // Left cell: image only
      const tdImage = document.createElement('td');
      tdImage.className = 'image-cell';
      tdImage.setAttribute('data-header', 'Image');

      if (project.image) {
        const wrapper = document.createElement('div');
        wrapper.className = 'image-cell-inner';

        const img = document.createElement('img');
        img.src = project.image;
        img.alt = project.title;
        img.loading = 'lazy';

        const pill = document.createElement('div');
        pill.className = 'image-pill';
        pill.textContent = 'Project';

        wrapper.appendChild(img);
        wrapper.appendChild(pill);
        tdImage.appendChild(wrapper);
      }

      // Right cell: title + tagline + Impact + Expertise
      const tdRight = document.createElement('td');
      tdRight.setAttribute('data-header', 'Project / Impact / Expertise');

      const titleEl = document.createElement('div');
      titleEl.className = 'project-title';
      const linkEl = document.createElement('a');
      linkEl.href = project.url;
      linkEl.target = '_blank';
      linkEl.rel = 'noopener noreferrer';
      linkEl.textContent = project.title;
      titleEl.appendChild(linkEl);

      const taglineEl = document.createElement('div');
      taglineEl.className = 'tagline';
      taglineEl.textContent = project.tagline || '';

      const metaRow = document.createElement('div');
      metaRow.className = 'meta-row';
      const meta1 = document.createElement('span');
      meta1.className = 'meta-badge';
      meta1.textContent = 'Innovation project';
      metaRow.appendChild(meta1);

      const impactLabel = document.createElement('div');
      impactLabel.className = 'impact-label';
      impactLabel.textContent = 'Impact';

      const impactText = document.createElement('div');
      impactText.className = 'impact-text';
      impactText.textContent = project.impact || '';

      const expLabel = document.createElement('div');
      expLabel.className = 'expertise-label';
      expLabel.textContent = 'Expertise gained';

      const expText = document.createElement('div');
      expText.className = 'expertise-text';
      expText.textContent = project.expertise || '';

      const chips = buildChips(project.expertise);

      tdRight.appendChild(titleEl);
      if (project.tagline) tdRight.appendChild(taglineEl);
      tdRight.appendChild(metaRow);
      tdRight.appendChild(impactLabel);
      tdRight.appendChild(impactText);
      tdRight.appendChild(expLabel);
      tdRight.appendChild(chips);
      tdRight.appendChild(expText);

      tr.appendChild(tdImage);
      tr.appendChild(tdRight);

      return tr;
    }

    function render(rows) {
      tbody.innerHTML = '';
      if (!rows.length) {
        const tr = document.createElement('tr');
        tr.className = 'no-data';
        const td = document.createElement('td');
        td.colSpan = 2;
        td.textContent = 'No matching projects';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }
      rows.forEach(p => tbody.appendChild(p._element));
    }

    function applyFilterAndSort() {
      const term = filterInput.value.toLowerCase().trim();

      let filtered = projects.slice();

      // Filter: primarily by expertise, and also by title
      if (term) {
        filtered = filtered.filter(p =>
          (p.expertise && p.expertise.toLowerCase().includes(term)) ||
          (p.title && p.title.toLowerCase().includes(term))
        );
      }

      // Ensure each project has a DOM row
      filtered.forEach(p => {
        if (!p._element) {
          p._element = buildRow(p);
        }
      });

      // Sort if a column is active
      if (sortState.key) {
        const key = sortState.key;
        const dir = sortState.direction;

        filtered = filtered.slice().sort((a, b) => {
          const va = (a[key] || '').toString().toLowerCase();
          const vb = (b[key] || '').toString().toLowerCase();

          const na = Number(va);
          const nb = Number(vb);
          const bothNumeric = !Number.isNaN(na) && !Number.isNaN(nb);

          if (bothNumeric) return (na - nb) * dir;
          return va.localeCompare(vb) * dir;
        });
      }

      render(filtered);
    }

    // Filter as you type; typing clears active trend selection
    filterInput.addEventListener('input', () => {
      if (activeTrend !== null) {
        setActiveTrend(null);
      }
      applyFilterAndSort();
    });

    // Click headers:
    // - "Image" header uses title as sort key
    // - "Project · Impact · Expertise" uses expertise text
    headers.forEach(header => {
      header.addEventListener('click', () => {
        const key = header.dataset.key;
        if (!key) return;

        if (sortState.key === key) {
          sortState.direction *= -1;
        } else {
          sortState.key = key;
          sortState.direction = 1;
        }

        headers.forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
        header.classList.add(
          sortState.direction === 1 ? 'sorted-asc' : 'sorted-desc'
        );

        applyFilterAndSort();
      });
    });

    // Trend chip click → set filter to that term
    trendChips().forEach(chip => {
      chip.addEventListener('click', () => {
        const term = chip.dataset.term;
        if (activeTrend === term) {
          // toggle off
          setActiveTrend(null);
          filterInput.value = '';
        } else {
          setActiveTrend(term);
          filterInput.value = term;
        }
        applyFilterAndSort();
      });
    });

    // Initial build + render
    projects.forEach(p => {
      p._element = buildRow(p);
    });
    applyFilterAndSort();
  </script>
</body>
</html>
