<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Excellence in Innovation – Interactive Projects</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 1.5rem;
      line-height: 1.4;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 0.25rem;
    }

    .subtitle {
      margin-bottom: 1rem;
      color: #555;
      font-size: 0.95rem;
    }

    #filter-input {
      padding: 0.4rem 0.6rem;
      margin: 0.5rem 0 1rem 0;
      max-width: 360px;
      width: 100%;
      box-sizing: border-box;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 0.75rem;
      font-size: 0.9rem;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f5f5f5;
      cursor: pointer;
      user-select: none;
      position: relative;
      white-space: nowrap;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    tr.no-data td {
      text-align: center;
      font-style: italic;
      color: #666;
    }

    th.sorted-asc::after,
    th.sorted-desc::after {
      position: absolute;
      right: 0.5rem;
      font-size: 0.75rem;
    }

    th.sorted-asc::after {
      content: "▲";
    }

    th.sorted-desc::after {
      content: "▼";
    }

    .project-cell {
      width: 260px;
    }

    .project-cell img {
      max-width: 240px;
      height: auto;
      display: block;
    }

    .project-title {
      font-weight: 600;
      margin: 0.5rem 0 0.25rem 0;
    }

    .project-title a {
      text-decoration: none;
    }

    .project-title a:hover {
      text-decoration: underline;
    }

    .tagline {
      color: #444;
      margin-bottom: 0.25rem;
    }

    .impact-label,
    .expertise-label {
      font-weight: 600;
    }

    .impact-text,
    .expertise-text {
      margin: 0.1rem 0 0.6rem 0;
    }

    @media (max-width: 800px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead {
        display: none;
      }
      tr {
        margin-bottom: 0.75rem;
        border: 1px solid #ddd;
      }
      td {
        border: none;
        border-bottom: 1px solid #eee;
      }
      td::before {
        font-weight: 600;
        display: block;
        margin-bottom: 0.1rem;
      }
      td[data-header]:before {
        content: attr(data-header);
      }
      .project-cell {
        width: auto;
      }
      .project-cell img {
        max-width: 100%;
      }
    }
  </style>
</head>

    <code>Sustainability</code>, <code>Deep Learning</code>) to filter projects.
    Filtering looks especially at the text under <strong>Expertise gained</strong>.
  </p>

  <input

    </tbody>
  </table>
